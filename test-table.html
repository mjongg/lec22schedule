<!DOCTYPE html>
<html>
<head>
<style>
table { width: 100%; border-collapse: collapse; }
td, th { border: 1px solid black; }
.flex-td { display: flex; flex-direction: column; }
</style>
</head>
<body>
<table>
  <tr>
    <td>Row 1 Col 1</td>
    <td class="flex-td">Row 1 Col 2</td>
    <td class="flex-td">Row 1 Col 3</td>
  </tr>
</table>
</body>
</html>
